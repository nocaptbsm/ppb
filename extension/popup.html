<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivacyShield Browser Agent</title>
  <style>
    :root {
      --color-bg-primary: #0b0f19;
      --color-bg-secondary: #131929;
      --color-border: #1e293b;
      --color-text-primary: #f8fafc;
      --color-text-secondary: #94a3b8;
      --color-accent-primary: #06b6d4;
      --color-accent-secondary: #ec4899;
      --color-success: #10b981;
      --color-blocked: #ef4444;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 420px;
      background: var(--color-bg-primary);
      color: var(--color-text-primary);
      font-family: var(--font-family);
      font-size: 13px;
      line-height: 1.5;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 16px;
    }
    .header-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }
    .header-title h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .header-title span {
      font-size: 10px;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    /* Input Group */
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .command-input {
      flex: 1;
      background: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      color: var(--color-text-primary);
      padding: 8px 12px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .command-input:focus {
      border-color: var(--color-accent-primary);
    }
    .run-btn {
      background: var(--color-accent-primary);
      border: none;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      transition: opacity 0.2s;
    }
    .run-btn:hover {
      opacity: 0.9;
    }
    .run-btn:disabled {
      background: var(--color-border);
      color: var(--color-text-secondary);
      cursor: not-allowed;
    }

    /* Status Banner */
    .status-banner {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(6, 182, 212, 0.05);
      border: 1px solid rgba(6, 182, 212, 0.2);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--color-accent-primary);
      margin-bottom: 16px;
      font-weight: 600;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(6, 182, 212, 0.2);
      border-top-color: var(--color-accent-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Blocked Banner */
    .blocked-banner {
      display: none;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--color-blocked);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 16px;
      font-weight: 600;
    }

    /* Tabs */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--color-text-secondary);
      padding: 6px 0;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      outline: none;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .tab-btn.active {
      color: var(--color-accent-primary);
      border-bottom-color: var(--color-accent-primary);
    }

    /* Tab Content */
    .tab-pane {
      display: none;
    }
    .tab-pane.active {
      display: block;
    }

    /* Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .metric-card {
      background: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      padding: 10px 8px;
      border-radius: 6px;
      text-align: center;
    }
    .metric-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-accent-primary);
      font-family: monospace;
    }
    .metric-label {
      font-size: 9px;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* Entity Map */
    .entity-map h3 {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--color-text-primary);
    }
    .entity-list {
      list-style: none;
      max-height: 120px;
      overflow-y: auto;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 4px;
      background: var(--color-bg-secondary);
    }
    .entity-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      padding: 4px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
    }
    .entity-item:last-child {
      border-bottom: none;
    }
    .entity-key {
      color: #f59e0b;
      font-family: monospace;
      font-weight: 700;
    }
    .entity-arrow {
      color: var(--color-text-secondary);
    }
    .entity-val {
      color: var(--color-text-secondary);
      text-decoration: line-through;
    }

    /* VLM Action Logs */
    .log-item {
      background: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .log-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 11px;
    }
    .log-cmd {
      font-weight: 600;
    }
    .log-time {
      color: var(--color-text-secondary);
    }
    .log-body {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-family: monospace;
    }
    .action-badge {
      background: rgba(6, 182, 212, 0.1);
      color: var(--color-accent-primary);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 9px;
      text-transform: uppercase;
      font-weight: 700;
    }
    .log-reason {
      font-size: 11px;
      color: var(--color-text-secondary);
      margin-top: 6px;
      font-style: italic;
      border-top: 1px dashed var(--color-border);
      padding-top: 4px;
    }

    .helper-text {
      color: var(--color-text-secondary);
      text-align: center;
      padding: 20px 0;
      font-style: italic;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <img src="icon.png" class="header-logo" alt="Logo">
    <div class="header-title">
      <h1>PrivacyShield Agent</h1>
      <span>Local-First VLM Firewall</span>
    </div>
  </div>

  <!-- Command Input -->
  <div class="input-group">
    <input type="text" id="cmd-input" class="command-input" placeholder="e.g. 'Add product to cart' or 'Update profile'">
    <button id="run-btn" class="run-btn">Run</button>
  </div>

  <!-- Status banner -->
  <div id="status-banner" class="status-banner">
    <div class="spinner"></div>
    <span id="status-text">Scanning page context...</span>
  </div>

  <!-- Blocked warning banner -->
  <div id="blocked-banner" class="blocked-banner">
    ⚠️ Request Blocked: Prompt Injection detected on page.
  </div>

  <!-- Tabs Navigation -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="privacy-pane">Privacy Engine</button>
    <button class="tab-btn" data-tab="actions-pane">Action Log</button>
  </div>

  <!-- Tab Contents -->
  <div class="tab-content">
    <!-- Privacy Tab -->
    <div id="privacy-pane" class="tab-pane active">
      <div class="metrics-grid">
        <div class="metric-card">
          <div id="protection-score" class="metric-value">100%</div>
          <div class="metric-label">Protection</div>
        </div>
        <div class="metric-card">
          <div id="retention-score" class="metric-value">100%</div>
          <div class="metric-label">Retention</div>
        </div>
        <div class="metric-card">
          <div id="reduction-score" class="metric-value">0%</div>
          <div class="metric-label">Reduction</div>
        </div>
      </div>

      <div class="entity-map">
        <h3>Local Redaction Map</h3>
        <ul id="entity-list" class="entity-list">
          <li class="helper-text" id="no-entities-text">No PII detected on current page.</li>
        </ul>
      </div>
    </div>

    <!-- Actions Tab -->
    <div id="actions-pane" class="tab-pane">
      <div id="logs-container">
        <div class="helper-text">No actions executed yet.</div>
      </div>
    </div>
  </div>

  <script src="privacyEngine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
